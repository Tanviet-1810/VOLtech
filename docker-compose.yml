version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: voltech-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=voltech
    restart: unless-stopped
    networks:
      - voltech-network

  backend:
    build: ./backend
    container_name: voltech-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/voltech
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key_min_32_characters_change_this}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - HOST=0.0.0.0
      - PORT=3000
      - CORS_ORIGIN=http://localhost
      - CORS_METHODS=GET,POST,PUT,DELETE,PATCH,OPTIONS
      - CORS_CREDENTIALS=true
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - voltech-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: voltech-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost
      - VITE_API_PORT=3000
      - VITE_API_PREFIX=/api
      - VITE_API_VER=/v1
      - VITE_API_TIMEOUT=5000
      - VITE_CHAT_BOT_API_KEY=${VITE_CHAT_BOT_API_KEY}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voltech-network

volumes:
  mongodb_data:
    driver: local

networks:
  voltech-network:
    driver: bridge
